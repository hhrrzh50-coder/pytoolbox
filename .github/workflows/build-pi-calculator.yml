name: Build Pi Calculator

on:
  workflow_dispatch:
  push:
    paths:
      - "projects/pi_calculator/**"
      - "pytoolbox/pi.py"
      - ".github/workflows/build-pi-calculator.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependency
        run: python -m pip install -r projects/pi_calculator/requirements-build.txt
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PiCalculator --paths . projects/pi_calculator/main.py
      - name: Publish portable executable into project folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path projects/pi_calculator/downloads | Out-Null
          Copy-Item dist/PiCalculator.exe projects/pi_calculator/downloads/PiCalculator-Windows-Portable.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/pi_calculator/downloads/PiCalculator-Windows-Portable.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build: update bundled portable app [skip ci]"
            git push
          }
      - name: Upload portable executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiCalculator-Windows-Portable
          path: projects/pi_calculator/downloads/PiCalculator-Windows-Portable.exe
          if-no-files-found: error
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        run: iscc projects/pi_calculator/installer.iss
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PiCalculator-Windows-Installer
          path: projects/pi_calculator/installer/PiCalculator-Setup.exe
          if-no-files-found: error
